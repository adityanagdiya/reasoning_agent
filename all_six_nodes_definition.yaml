Nodes:
  Start:
    description: |
      The entry point of a flow.

      This node initializes the flow execution. It receives the initial
      triggering document and provides it to the flow via the _Data output.

      Returns:
        _Data (any): The initial document that triggered the flow.

      Config:
        label (string): A descriptive label for this start node.
        notes (string): Additional documentation or notes about this flow's entry.
    group: Basic
    action: ""
    inputs: {}
    outputs:
      _Data: any
    config:
      - label: Label
        name: label
        type: string
      - label: Notes
        name: notes
        type: string
        rows: 5

  End:
    description: |
      A termination point of a flow.

      This node marks the end of a flow execution path. It collects data from
      the _Data input to be included in the flow's final output or result.

      Args:
        _Data (any): The data to be returned as part of the flow execution result.

      Config:
        label (string): A descriptive label for this end node.
        notes (string): Additional documentation or notes about this flow's exit.
    group: Basic
    action: ""
    inputs:
      _Data: any
    outputs: {}
    config:
      - label: Label
        name: label
        type: string
      - label: Notes
        name: notes
        type: string
        rows: 5

  Logic:
    description: |
      Executes custom Groovy  logic.

      This node allows for complex data transformation or custom operations
      by executing a script. It supports dynamic input and output sockets.

      Args:
        inp (any): Default input socket. Additional sockets can be configured.

      Returns:
        out (any): Default output socket. Additional sockets can be configured.

      Config:
        label (string): A descriptive label for this logic node.
        notes (string): Additional documentation or notes about the script's logic.
        incomingSockets (string): Comma-separated list of input socket names(e.g. inp1,inp2,...).
        outgoingSockets (string): Comma-separated list of output socket names.
        logic (string): The script to execute in Groovy.(e.g. out=inp1+inp2)
    group: Basic
    action: ""
    inputs:
      inp: any
    outputs:
      out: any
    config:
      - label: Label
        name: label
        type: string
      - label: Notes
        name: notes
        type: string
        rows: 5
      - label: Incoming Sockets
        name: incomingSockets
        type: string
        rows: 2
        defaultValue: inp
      - label: Outgoing Sockets
        name: outgoingSockets
        type: string
        rows: 2
        defaultValue: out
      - label: Logic
        name: logic
        type: editor

  Core:Log:
    description: |
      Logs a message to the system log.

      This node takes an input and passes it through to the output, while
      writing a configured message along with the input data to the system log.

      Args:
        _In (any): The input data to be logged and passed through.

      Returns:
        _Out (any): The same data received on the _In socket.

      Config:
        label (string): A descriptive label for this log node.
        message (string): The message to be written to the log.
    group: System
    action: log
    inputs:
      _In: any
    outputs:
      _Out: any
    config:
      - label: Label
        name: label
        type: string
      - label: Message
        name: message
        type: string

  Core:If:
    description: |
      Evaluates a boolean expression to route data.

      This node evaluates a Groovy expression. If the expression evaluates to
      true, the input data is forwarded to the _True output; otherwise, it is
      forwarded to the _False output.

      Args:
        _Data (any): The data to be routed based on the expression result.

      Returns:
        _True (any): The input data if the expression evaluates to true.
        _False (any): The input data if the expression evaluates to false.

      Config:
        label (string): A descriptive label for this if node.
        expression (string): A Groovy expression that returns a boolean.
          The input data is available as `_Data`.
    action: executeIf
    group: Logic
    inputs:
      _Data: any
    outputs:
      _True: any
      _False: any
    config:
      - label: Label
        name: label
        type: string
      - label: $Expression
        name: expression
        type: string

  Core:HTTPRequest:
    description: |
      Performs an HTTP request to an external endpoint.

      This node allows making various types of HTTP requests (GET, POST, etc.)
      with support for headers, query parameters, authentication, and proxies.

      Args:
        _Data (any): Input data that can be used within the configuration
          expressions (e.g., in the request body).

      Returns:
        _Response (any): The response body (in Simple mode) or the full
          response object (in Extended mode) if the request is successful.
        _Error (any): An error object containing status, statusText, and body
          if the request fails.

      Config:
        label (string): A descriptive label for this http request node.
        mode (string): Operation mode. 'Simple' returns only the body,
          'Extended' returns the full response object. Defaults to 'Simple'.
        endpoint (string): The target URL for the HTTP request.
        method (string): The HTTP method to use (get, post, put, patch, delete).
          Defaults to 'get'.
        headers (string): HTTP headers as a map or expression.
        queryStrings (string): Query parameters as a map or expression.
        body (string): The request body content or expression.
        typeOfResponse (string): How to parse the response (Plain, JSON As Map).
          Defaults to 'JSON As Map'.
        proxy (string): Proxy server hostname.
        proxyPort (number): Proxy server port.
        proxyUser (string): Username for proxy authentication.
        proxyPassword (string): Password for proxy authentication.
        basicAuthUser (string): Username for Basic Authentication.
        basicAuthPassword (string): Password for Basic Authentication.
        keyStore (string): Path to the key store file for SSL.
        keyStorePassword (string): Password for the key store.
        trustStore (string): Path to the trust store file for SSL.
        trustStorePassword (string): Password for the trust store.
    group: Outbound
    action: httpRequest
    inputs:
      _Data: any
    outputs:
      _Response: any
      _Error: any
    config:
      - label: Label
        name: label
        type: string
      - label: Mode
        name: mode
        type: string
        inputType: select
        defaultValue: Simple
        options:
          - Simple
          - Extended
      - label: Endpoint
        name: endpoint
        type: string
      - label: Method
        name: method
        inputType: select
        defaultValue: get
        options:
          - get
          - post
          - put
          - patch
          - delete
        type: string
      - label: Headers
        name: headers
        type: string
      - label: QueryStrings
        name: queryStrings
        type: string
      - label: Body
        name: body
        type: string
      - label: Type Of Response
        name: typeOfResponse
        type: string
        inputType: select
        defaultValue: JSON As Map
        options:
          - Plain
          - JSON As Map
      - label: Proxy
        name: proxy
        type: string
      - label: Proxy Port
        name: proxyPort
        type: number
      - label: Proxy User
        name: proxyUser
        type: string
      - label: Proxy Password
        name: proxyPassword
        type: string
        inputType: password
      - label: Basic Auth User
        name: basicAuthUser
        type: string
      - label: Basic Auth Password
        name: basicAuthPassword
        type: string
        inputType: password
      - label: Key Store Path
        name: keyStore
        type: string
      - label: Key Store Password
        name: keyStorePassword
        type: string
        inputType: password
      - label: Trust Store Path
        name: trustStore
        type: string
      - label: Trust Store Password
        name: trustStorePassword
        type: string
        inputType: password
